		<main>
			<h2>Kontaktirajte nas</h2>
			<section class="kontakt-podaci">
				<h3>Kontakt Podaci</h3>
				<p>Adresa: Ulica Putovanja 1, 10000 Zagreb, Hrvatska</p>
				<p>Radno vrijeme: Ponedjeljak - Petak, 09:00 - 17:00</p>
				<div class="drustvene-mreze">
					<img src="../dokumenti/slike/facebook.png" alt="Facebook" class="ikona">
					<img src="../dokumenti/slike/twitter.png" alt="X" class="ikona">
					<img src="../dokumenti/slike/instagram.png" alt="Instagram" class="ikona">
				</div>
			</section>

			<section id="kontakt-forma">
				<h3>Kontakt Forma</h3>
				<form action="https://spider.foi.hr/UWT/materijali/ispis_forme.php" method="post">
					<label for="ime">Ime:</label>
					<input type="text" id="ime" name="ime" required>
					
					<label for="email">Email:</label>
					<input type="email" id="email" name="email" required>
					
					<label for="telefon">Telefon:</label>
					<input type="tel" id="telefon" name="telefon" required>

					<label for="tema">Tema:</label>
					<select id="tema" name="tema" required>
						<option value="" disabled selected>Select an option</option>
						<option value="upit">Opći upit</option>
						<option value="podrska">Podrška</option>
						<option value="reklamacija">Reklamacija</option>
					</select>
					
					<label for="poruka">Poruka:</label>
					<textarea id="poruka" name="poruka" required></textarea>
					
					<button type="submit">Pošalji</button>
				</form>
			</section>
